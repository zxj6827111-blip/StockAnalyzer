services:
  api:
    environment:
      SA__APP__ADVISORY_ONLY: "true"
      SA__TRAINING__ENABLED: "false"
      SA__AUTO_PROMOTION__ENABLED: "false"
      SA__DATA_SOURCE__PRIMARY: vendor_zip_overlay
      SA__DATA_SOURCE__LOCAL_DATA_ROOT: /data/vendor_history
      SA__DATA_SOURCE__VENDOR_ZIP_INDEX_PATH: /app/artifacts/vendor_overlay/daily_index.json
      SA__DATA_SOURCE__VENDOR_ZIP_DAILY_DIR: 全A日K
      SA__DATA_SOURCE__VENDOR_ZIP_PRICE_SERIES_MODE: qfq
      SA__DATA_SOURCE__VENDOR_ZIP_DAILY_VOLUME_MULTIPLIER: "100"
      SA__DATA_SOURCE__VENDOR_ZIP_DAILY_TURNOVER_MULTIPLIER: "1000"
      SA__DATA_SOURCE__VENDOR_ZIP_MINUTE_VOLUME_MULTIPLIER: "100"
      SA__DATA_SOURCE__VENDOR_ZIP_MINUTE_AMOUNT_MULTIPLIER: "1"
      SA__DATA_SOURCE__VENDOR_ZIP_INTRADAY_ENABLED: "true"
      SA__DATA_SOURCE__VENDOR_ZIP_MEMORY_CACHE_SYMBOLS: "32"
      SA__DATA_SOURCE__WAREHOUSE_DB_PATH: /app/artifacts/vendor_delta/market_delta.duckdb
      SA__MARKET_WAREHOUSE__DB_PATH: /app/artifacts/vendor_delta/market_delta.duckdb
      SA__MARKET_WAREHOUSE__PACKAGE_ROOT: /app/artifacts/vendor_delta/package
      SA__MARKET_WAREHOUSE__BOOTSTRAP_SOURCE_ROOT: /app/artifacts/vendor_delta/package
      SA__MARKET_WAREHOUSE__BOOTSTRAP_ON_FIRST_SYNC: "false"
      SA__MARKET_WAREHOUSE__OFFLINE_BOOTSTRAP_ENABLED: "false"
      SA__MARKET_WAREHOUSE__ONLINE_DAILY_PRIMARY: tushare
      SA__MARKET_WAREHOUSE__ONLINE_DAILY_BACKUP: akshare
      SA__MARKET_WAREHOUSE__POST_FOLLOWUP_RUN_TRAINING: "false"
      SA__EVOLUTION__EXECUTION_SPEC__PRICE_SERIES_MODE: raw
      SA__EVOLUTION__EXECUTION_SPEC__DIVIDEND_TREATMENT: explicit_cashflow
    volumes:
      - ${SA_VENDOR_HISTORY_HOST_ROOT:?set SA_VENDOR_HISTORY_HOST_ROOT}:/data/vendor_history:ro

  scheduler:
    environment:
      SA__APP__ADVISORY_ONLY: "true"
      SA__TRAINING__ENABLED: "false"
      SA__AUTO_PROMOTION__ENABLED: "false"
      SA__DATA_SOURCE__PRIMARY: vendor_zip_overlay
      SA__DATA_SOURCE__LOCAL_DATA_ROOT: /data/vendor_history
      SA__DATA_SOURCE__VENDOR_ZIP_INDEX_PATH: /app/artifacts/vendor_overlay/daily_index.json
      SA__DATA_SOURCE__VENDOR_ZIP_DAILY_DIR: 全A日K
      SA__DATA_SOURCE__VENDOR_ZIP_PRICE_SERIES_MODE: qfq
      SA__DATA_SOURCE__VENDOR_ZIP_DAILY_VOLUME_MULTIPLIER: "100"
      SA__DATA_SOURCE__VENDOR_ZIP_DAILY_TURNOVER_MULTIPLIER: "1000"
      SA__DATA_SOURCE__VENDOR_ZIP_MINUTE_VOLUME_MULTIPLIER: "100"
      SA__DATA_SOURCE__VENDOR_ZIP_MINUTE_AMOUNT_MULTIPLIER: "1"
      SA__DATA_SOURCE__VENDOR_ZIP_INTRADAY_ENABLED: "true"
      SA__DATA_SOURCE__VENDOR_ZIP_MEMORY_CACHE_SYMBOLS: "32"
      SA__DATA_SOURCE__WAREHOUSE_DB_PATH: /app/artifacts/vendor_delta/market_delta.duckdb
      SA__MARKET_WAREHOUSE__DB_PATH: /app/artifacts/vendor_delta/market_delta.duckdb
      SA__MARKET_WAREHOUSE__PACKAGE_ROOT: /app/artifacts/vendor_delta/package
      SA__MARKET_WAREHOUSE__BOOTSTRAP_SOURCE_ROOT: /app/artifacts/vendor_delta/package
      SA__MARKET_WAREHOUSE__BOOTSTRAP_ON_FIRST_SYNC: "false"
      SA__MARKET_WAREHOUSE__OFFLINE_BOOTSTRAP_ENABLED: "false"
      SA__MARKET_WAREHOUSE__ONLINE_DAILY_PRIMARY: tushare
      SA__MARKET_WAREHOUSE__ONLINE_DAILY_BACKUP: akshare
      SA__MARKET_WAREHOUSE__POST_FOLLOWUP_RUN_TRAINING: "false"
      SA__EVOLUTION__EXECUTION_SPEC__PRICE_SERIES_MODE: raw
      SA__EVOLUTION__EXECUTION_SPEC__DIVIDEND_TREATMENT: explicit_cashflow
    volumes:
      - ${SA_VENDOR_HISTORY_HOST_ROOT:?set SA_VENDOR_HISTORY_HOST_ROOT}:/data/vendor_history:ro
