name: quality

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # pip 缓存：requirements 庞大（dev 依赖 439 行），每次全量重装
          # 是 CI 的大头之一；命中缓存可省 2~4 分钟。
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Layered Quality Gate (ruff/mypy)
        run: python scripts/run_quality_gate.py --stage clean-scope --fail-on-error

      - name: Full Test Suite with Coverage Gate
        run: python scripts/run_quality_gate.py --stage full --fail-on-error

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage/coverage.xml
          if-no-files-found: error

      - name: Slow Test Report
        run: python scripts/run_quality_gate.py --stage slow-report
        continue-on-error: true
