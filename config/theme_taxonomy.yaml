# M12 宏观事件主题层种子知识库（核心资产）
# ---------------------------------------------------------------
# 原则：先小而准（种子 ≤6 族）；价格确认对象必须是真实期货主力连续合约
# （经 price_confirmation 内置注册表解析，未注册的商品会被记录为 unresolved）；
# 阈值冻结于 shadow 数据收集前（参照 Phase 1.5 多重比较教训），不可因信号少调低。
#
# 板块名与数据源（2026-09-10 起）：
#   boards 是**规范名**，种子期沿用东财命名（stock_board_*_name_em）。东财
#   push2*.eastmoney.com 行情主机族被网络策略切断后，板块成分改由 tushare
#   同花顺/申万名录解析（见 theme/board_resolver.py），各源命名体系不同，
#   因此用 board_aliases 显式声明等价名——解析器按 [规范名, *别名] 逐个
#   **精确**匹配，不做模糊匹配（模糊匹配会把"国产芯片"猜成数百只规模的
#   泛概念板块，静默把主题稀释成噪声）。
#   下列别名均于 2026-09-10 在 NAS 上用真实接口逐个验证过（括号内为实测成分数）。
#   暂无等价名的板块保留原名，解析为 unresolved 并记录在报告里，等命名决策。
#
themes:
  - theme_id: geo_oil
    event_type: geopolitics
    description: 地缘冲突→原油
    event_keywords: [战争, 冲突, 制裁, 封锁, 袭击, 霍尔木兹, 减产]
    direction: 1
    commodities: [SC原油, BRENT]
    boards: [石油行业, 油气设服, 页岩气, 航运概念, 煤化工]
    # 油气开采及服务(19) / 油服工程(11) / 煤化工概念(112)；页岩气(52)、
    # 航运概念(86) 与同花顺同名，无需别名。煤化工必须给别名：同花顺存在同名
    # 行业版（884281.TI，仅 8 只），会遮蔽目标概念板块。
    board_aliases:
      石油行业: [油气开采及服务]
      油气设服: [油服工程]
      煤化工: [煤化工概念]
    symbols: []

  - theme_id: enso_agri
    event_type: climate
    description: 厄尔尼诺/气候→农产品
    event_keywords: [厄尔尼诺, 拉尼娜, 干旱, 洪涝, 寒潮]
    direction: 1
    commodities: [白糖, 棕榈油, 橡胶, 豆粕]
    boards: [农业种植, 农牧饲渔, 天然橡胶, 水产养殖, 种业]
    # 农林牧渔(申万 L1，104 只当前成分) 覆盖"农牧饲渔"整族；橡胶制品(22) /
    # 种子生产(10)。农业种植(93) 与同花顺同名。水产养殖同花顺仅 3 只，偏窄——
    # 待命名决策（东财原板块约 20 只）。
    board_aliases:
      农牧饲渔: [农林牧渔]
      天然橡胶: [橡胶制品]
      种业: [种子生产]
    symbols: []

  - theme_id: heat_power
    event_type: climate
    description: 极端高温→电力
    event_keywords: [高温, 用电负荷, 电力缺口]
    direction: 1
    commodities: [动力煤]
    boards: [电力行业, 火电, 水电, 虚拟电厂]
    # 电力(110)；火电(31)、水电(11)、虚拟电厂(157) 与同花顺同名。
    board_aliases:
      电力行业: [电力]
    symbols: []

  - theme_id: policy_infra
    event_type: policy
    description: 政策→基建/建材
    event_keywords: [基建投资, 专项债, 重大项目, 新基建, 城中村改造]
    direction: 1
    commodities: [螺纹钢]
    boards: [工程建设, 水泥建材, 基建工程, 一带一路]
    # 建筑与工程Ⅲ(A股)(167) / 水泥概念(46) / 基础建设(27)；一带一路(791) 同名。
    board_aliases:
      工程建设: [建筑与工程Ⅲ(A股)]
      水泥建材: [水泥概念]
      基建工程: [基础建设]
    symbols: []

  - theme_id: supply_chip
    event_type: supply_chain
    description: 供应链→半导体/芯片
    event_keywords: [出口管制, 断供, 禁令, 光刻机, 先进制程]
    direction: 1
    commodities: [沪铜]
    # 国产芯片 / 中芯概念 无等价名：同花顺"芯片概念"910 只（约占全市场 16%），
    # 用作主题成分等于把整条电子链全量注入，语义失真，故不设别名、留 unresolved，
    # 待人工给定命名或改为静态 symbols 精选。半导体(185)、光刻机(51) 同名可用。
    boards: [半导体, 国产芯片, 中芯概念, 光刻机]
    symbols: []

confirmation:
  price_move_1d_min: 0.015
  price_move_3d_min: 0.03
  lookback_days: 3
